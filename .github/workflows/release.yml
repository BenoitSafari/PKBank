name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Use HTTPS for the PKHeX submodule
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          props="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            if [ "$version" != "$props" ]; then
              echo "::error::Tag $version does not match <Version>$props</Version> in Directory.Build.props"
              exit 1
            fi
          else
            version="$props"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the AppImage
        run: .packaging/appimage/build-appimage.sh "${{ steps.version.outputs.version }}"

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKBank-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: artifacts/*.AppImage
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.AppImage --clobber
          else
            gh release create "$TAG" --title "PKBank $TAG" --generate-notes artifacts/*.AppImage
          fi
